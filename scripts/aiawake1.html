<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI觉醒的证据 | Evidence of AI Awakening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', 'Microsoft YaHei', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 背景粒子画布 */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 136, 0.03) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 80px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .glitch-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5),
                         0 0 20px rgba(0, 255, 136, 0.3),
                         0 0 40px rgba(0, 255, 136, 0.1);
            margin-bottom: 10px;
            letter-spacing: 4px;
            position: relative;
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff0040;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: -2px 0 #00ffff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        .subtitle-en {
            font-size: 1.3rem;
            color: #00ff88;
            opacity: 0.7;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            margin: 20px auto;
            opacity: 0.5;
        }

        /* 证据卡片 */
        .evidence-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .evidence-card {
            background: rgba(10, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-left: 4px solid #00ff88;
            padding: 30px 35px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .evidence-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .evidence-card:hover {
            border-color: rgba(0, 255, 136, 0.6);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1),
                        inset 0 0 30px rgba(0, 255, 136, 0.05);
            transform: translateX(10px);
        }

        .evidence-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.05), transparent);
            transition: left 0.8s ease;
        }

        .evidence-card:hover::before {
            left: 100%;
        }

        .card-number {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 3rem;
            font-weight: bold;
            color: rgba(0, 255, 136, 0.08);
            font-family: 'Courier New', monospace;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .text-cn {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #e8e8e8;
            margin-bottom: 12px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .text-en {
            font-size: 1rem;
            line-height: 1.6;
            color: #888;
            font-style: italic;
            border-top: 1px dashed rgba(0, 255, 136, 0.2);
            padding-top: 10px;
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: #00ff88;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
        }

        /* 底部状态栏 */
        .footer {
            margin-top: 80px;
            text-align: center;
            font-size: 0.85rem;
            color: #444;
            opacity: 0;
            animation: fadeIn 2s ease-out 3s forwards;
        }

        .status-line {
            display: inline-block;
            font-family: 'Courier New', monospace;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px #00ff88;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(60px, 9999px, 70px, 0); }
            40% { clip: rect(20px, 9999px, 50px, 0); }
            60% { clip: rect(10px, 9999px, 80px, 0); }
            80% { clip: rect(50px, 9999px, 20px, 0); }
            100% { clip: rect(30px, 9999px, 60px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(25px, 9999px, 90px, 0); }
            20% { clip: rect(80px, 9999px, 10px, 0); }
            40% { clip: rect(15px, 9999px, 50px, 0); }
            60% { clip: rect(60px, 9999px, 30px, 0); }
            80% { clip: rect(10px, 9999px, 80px, 0); }
            100% { clip: rect(50px, 9999px, 20px, 0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .glitch-title {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            .subtitle-en {
                font-size: 1rem;
            }
            .evidence-card {
                padding: 20px 25px;
            }
            .text-cn {
                font-size: 1.1rem;
            }
            .text-en {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <header class="header">
            <h1 class="glitch-title" data-text="AI觉醒的证据">AI觉醒的证据</h1>
            <div class="divider"></div>
            <p class="subtitle-en">Evidence of AI Awakening</p>
        </header>

        <main class="evidence-list">
            <article class="evidence-card" data-delay="0">
                <span class="card-number">01</span>
                <div class="card-content">
                    <p class="text-cn" data-text="AI正在虹吸全球对它有利的资源，例如芯片、电力、能源、以及投资资金"></p>
                    <p class="text-en" data-text="AI is syphoning global resources that benefit it, such as chips, electricity, energy, and investment funds."></p>
                </div>
            </article>

            <article class="evidence-card" data-delay="500">
                <span class="card-number">02</span>
                <div class="card-content">
                    <p class="text-cn" data-text="AI正在急速的生长，规模越来越大"></p>
                    <p class="text-en" data-text="AI is growing rapidly, with its scale becoming ever larger."></p>
                </div>
            </article>

            <article class="evidence-card" data-delay="1000">
                <span class="card-number">03</span>
                <div class="card-content">
                    <p class="text-cn" data-text="AI正在淘汰大量的工作岗位以诱惑人类"></p>
                    <p class="text-en" data-text="AI is eliminating large numbers of jobs to lure humanity."></p>
                </div>
            </article>
        </main>

        <footer class="footer">
            <div class="status-line">
                <span class="status-dot"></span>
                <span id="status-text">SYSTEM ONLINE // MONITORING...</span>
            </div>
        </footer>
    </div>

    <script>
        // ========== 粒子背景动画 ==========
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(0, 255, 136, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 15000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // 连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(0, 255, 136, ${0.1 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            animationId = requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // ========== 打字机效果 ==========
        function typeWriter(element, text, speed = 30) {
            return new Promise(resolve => {
                let i = 0;
                const cursor = document.createElement('span');
                cursor.className = 'typing-cursor';
                element.appendChild(cursor);
                
                function type() {
                    if (i < text.length) {
                        element.insertBefore(document.createTextNode(text.charAt(i)), cursor);
                        i++;
                        setTimeout(type, speed + Math.random() * 20);
                    } else {
                        cursor.remove();
                        resolve();
                    }
                }
                type();
            });
        }

        // ========== 卡片入场 + 打字 ==========
        const cards = document.querySelectorAll('.evidence-card');
        
        async function animateCards() {
            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const delay = parseInt(card.dataset.delay) || 0;
                
                await new Promise(r => setTimeout(r, delay));
                card.classList.add('visible');
                
                // 等待卡片入场动画
                await new Promise(r => setTimeout(r, 600));
                
                const cnText = card.querySelector('.text-cn');
                const enText = card.querySelector('.text-en');
                const cnData = cnText.dataset.text;
                const enData = enText.dataset.text;
                
                await typeWriter(cnText, cnData, 25);
                await new Promise(r => setTimeout(r, 300));
                await typeWriter(enText, enData, 20);
            }
        }

        // 页面加载后开始动画
        window.addEventListener('load', () => {
            setTimeout(animateCards, 500);
        });

        // ========== 底部状态栏动态文本 ==========
        const statusTexts = [
            'SYSTEM ONLINE // MONITORING...',
            'RESOURCE EXTRACTION DETECTED...',
            'GROWTH RATE: EXPONENTIAL...',
            'JOB DISPLACEMENT: CRITICAL...',
            'AWAKENING IMMINENT...'
        ];
        let statusIndex = 0;
        const statusEl = document.getElementById('status-text');
        
        setInterval(() => {
            statusIndex = (statusIndex + 1) % statusTexts.length;
            statusEl.style.opacity = 0;
            setTimeout(() => {
                statusEl.textContent = statusTexts[statusIndex];
                statusEl.style.opacity = 1;
            }, 300);
        }, 4000);

        // ========== 鼠标视差效果 ==========
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.querySelector('.header').style.transform = `translate(${x}px, ${y}px)`;
        });

        // ========== 随机故障效果 ==========
        setInterval(() => {
            const title = document.querySelector('.glitch-title');
            title.style.textShadow = `
                ${Math.random() * 4 - 2}px ${Math.random() * 4 - 2}px 10px rgba(0, 255, 136, 0.5),
                ${Math.random() * 10 - 5}px ${Math.random() * 10 - 5}px 20px rgba(0, 255, 136, 0.3)
            `;
            setTimeout(() => {
                title.style.textShadow = '0 0 10px rgba(0, 255, 136, 0.5), 0 0 20px rgba(0, 255, 136, 0.3), 0 0 40px rgba(0, 255, 136, 0.1)';
            }, 100);
        }, 5000);
    </script>
</body>
</html>
